<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fanmustore</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#faf7ff;
  color:#333
}

header{
  background:linear-gradient(135deg,#9c27b0,#d41470);
  color:#fff;
  text-align:center;
  padding:55px 20px
}

header h1{
  font-size:42px;
  margin-bottom:25px
}

header p{
  font-size:24px
}

main{
  max-width:900px;
  margin:auto;
  padding:35px 18px 60px
}

.store-title{
  text-align:center;
  margin-bottom:25px
}

.store-title h2{
  color:#8e24aa;
  font-size:34px;
  margin-bottom:10px
}

.store-title p{
  font-size:20px;
  line-height:1.6
}

.cart-bar{
  position:sticky;
  top:10px;
  z-index:10;
  display:flex;
  justify-content:flex-end;
  margin-bottom:22px
}

.cart-button{
  border:0;
  background:#8e24aa;
  color:#fff;
  border-radius:50%;
  width:55px;
  height:55px;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px
}

.products{
  display:grid;
  gap:25px
}

.card{
  background:linear-gradient(145deg,#ffffff,#fbf4ff);
  border-radius:28px;
  overflow:hidden;
  border:1px solid #ead8f3;
  box-shadow:0 8px 25px rgba(142,36,170,.12);
  transition:transform .2s ease,box-shadow .2s ease
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px rgba(142,36,170,.20)
}

.card img{
  display:block;
