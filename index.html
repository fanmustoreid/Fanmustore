<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fanmustore</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#faf7ff;
  color:#333
}

header{
  background:linear-gradient(135deg,#9c27b0,#d41470);
  color:#fff;
  text-align:center;
  padding:55px 20px
}

header h1{
  font-size:42px;
  margin-bottom:25px
}

header p{
  font-size:24px
}

main{
  max-width:900px;
  margin:auto;
  padding:35px 18px 60px
}

.store-title{
  text-align:center;
  margin-bottom:25px
}

.store-title h2{
  color:#8e24aa;
  font-size:34px;
  margin-bottom:10px
}

.store-title p{
  font-size:20px;
  line-height:1.6
}

.cart-bar{
  position:sticky;
  top:10px;
  z-index:10;
  display:flex;
  justify-content:flex-end;
  margin-bottom:22px
}

.cart-button{
  border:0;
  background:#8e24aa;
  color:#fff;
  border-radius:50%;
  width:55px;
  height:55px;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px
}

.products{
  display:grid;
  gap:25px
}

.card{
  background:#fff;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(80,30,100,.1)
}

.card img{
  display:block;
  width:100%;
  height:260px;
  object-fit:cover;
  background:#f1edf5
}

.card-content{
  padding:22px 28px 28px
}

.card h3{
  font-size:23px;
  margin-bottom:12px
}

.price{
  color:#b21f62;
  font-size:29px;
  font-weight:bold;
  margin-bottom:12px
}

.stock{
  font-size:18px;
  font-weight:bold;
  margin-bottom:18px
}

.available{
  color:#388e3c
}

.sold{
  color:#777
}

.order-btn{
  display:block;
  width:100%;
  border:0;
  border-radius:22px;
  background:#9225ad;
  color:#fff;
  text-align:center;
  padding:17px;
  font-size:21px;
  font-weight:bold;
  cursor:pointer
}

.order-btn:disabled{
  background:#ccc;
  cursor:not-allowed
}

.cart-panel{
  display:none;
  background:#fff;
  border-radius:25px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(80,30,100,.15)
}

.cart-panel.show{
  display:block
}

.cart-panel h2{
  color:#8e24aa;
  margin-bottom:18px
}

.cart-empty{
  color:#777;
  padding:10px 0
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #eee
}

.cart-item-name{
  font-weight:bold;
  flex:1
}

.cart-item-controls{
  display:flex;
  align-items:center;
  gap:8px
}

.qty-btn{
  border:0;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#eee;
  font-size:18px;
  cursor:pointer
}

.remove-btn{
  border:0;
  background:none;
  color:#d32f2f;
  cursor:pointer;
  font-size:13px
}

.cart-total{
  text-align:right;
  font-size:23px;
  font-weight:bold;
  margin:22px 0;
  color:#b21f62
}

.checkout-btn{
  width:100%;
  border:0;
  border-radius:22px;
  background:#25d366;
  color:#fff;
  padding:16px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer
}

.clear-btn{
  width:100%;
  margin-top:10px;
  border:0;
  background:transparent;
  color:#777;
  padding:10px;
  cursor:pointer
}

footer{
  text-align:center;
  padding:30px;
  color:#777;
  font-size:18px
}

@media(max-width:600px){
  header{
    padding:45px 15px
  }

  header h1{
    font-size:35px
  }

  header p{
    font-size:19px
  }

  main{
    padding:28px 16px 50px
  }

  .card img{
    height:230px
  }

  .card-content{
    padding:20px
  }

  .card h3{
    font-size:21px
  }
}
</style>
</head
